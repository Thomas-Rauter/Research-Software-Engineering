<?xml version="1.0" encoding="utf-8"?>
<!-- Layered API design (Design Principles, "Make the common case easy, and
     the uncommon case possible"). One unit of the former TikZ figure is
     40 px. The white background keeps the figure legible in dark mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 136" width="510" height="136"
     font-family="STIX Two Text, Times New Roman, serif" font-size="15">
  <rect width="510" height="136" fill="#ffffff"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <line x1="100" y1="30" x2="500" y2="30" stroke="#000000" stroke-width="1"
        marker-end="url(#head)"/>
  <text x="300" y="22" text-anchor="middle">Layers</text>
  <rect x="100" y="46" width="400" height="32" fill="none" stroke="#000000"/>
  <polygon points="100,78 100,46 500,78" fill="#000000"/>
  <text x="92" y="67" text-anchor="end">Control</text>
  <rect x="100" y="94" width="400" height="32" fill="none" stroke="#000000"/>
  <polygon points="100,126 500,94 500,126" fill="#000000"/>
  <text x="92" y="115" text-anchor="end">Convenience</text>
</svg>
