<?xml version="1.0" encoding="utf-8"?>
<!-- The structure of a Zarr store (Zarr, "What Zarr is"), with the example of
     the figure in HDF5. Groups are white boxes and arrays gray boxes, both
     directories; each holds a file zarr.json, tied to its attributes, and an
     array holds a file per chunk as well. A legend below names the four. The
     white background keeps the figure legible in dark mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500"
     font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12">
  <rect width="640" height="500" fill="#ffffff"/>

  <!-- Groups: the store ocean.zarr/ and, inside it, one group per run. -->
  <g fill="none" stroke="#000000">
    <rect x="10" y="10" width="620" height="448" rx="6"/>
    <rect x="30" y="190" width="580" height="180" rx="6"/>
    <rect x="30" y="382" width="580" height="64" rx="6"/>
  </g>
  <g font-weight="bold" font-size="13">
    <text x="24" y="37">ocean.zarr/</text>
    <text x="44" y="217">run_01/</text>
    <text x="44" y="409">run_02/</text>
  </g>
  <text x="44" y="434">…</text>

  <!-- Arrays: the name, the type, and the shape. -->
  <g fill="#e0e0e0" stroke="#000000">
    <rect x="24" y="54" width="592" height="58" rx="3"/>
    <rect x="24" y="120" width="592" height="58" rx="3"/>
    <rect x="44" y="234" width="552" height="58" rx="3"/>
    <rect x="44" y="300" width="552" height="58" rx="3"/>
  </g>
  <text x="34" y="72">lat/</text>
  <text x="134" y="72">float64</text>
  <text x="199" y="72">720</text>
  <text x="34" y="138">lon/</text>
  <text x="134" y="138">float64</text>
  <text x="199" y="138">1440</text>
  <text x="54" y="252">temperature/</text>
  <text x="154" y="252">float32</text>
  <text x="219" y="252">365 × 720 × 1440</text>
  <text x="54" y="318">salinity/</text>
  <text x="154" y="318">float32</text>
  <text x="219" y="318">365 × 720 × 1440</text>

  <!-- Files: a zarr.json in every group and array, and a file per chunk. -->
  <g fill="#ffffff" stroke="#000000" stroke-linejoin="round">
    <path d="M316,22 h76 l7,7 v13 h-83 z"/>
    <path d="M34,82 h33 l7,7 v13 h-40 z"/>
    <path d="M316,82 h76 l7,7 v13 h-83 z"/>
    <path d="M34,148 h33 l7,7 v13 h-40 z"/>
    <path d="M316,148 h76 l7,7 v13 h-83 z"/>
    <path d="M316,202 h76 l7,7 v13 h-83 z"/>
    <path d="M54,262 h62 l7,7 v13 h-69 z"/>
    <path d="M129,262 h62 l7,7 v13 h-69 z"/>
    <path d="M218,262 h76 l7,7 v13 h-83 z"/>
    <path d="M316,262 h76 l7,7 v13 h-83 z"/>
    <path d="M54,328 h62 l7,7 v13 h-69 z"/>
    <path d="M129,328 h62 l7,7 v13 h-69 z"/>
    <path d="M218,328 h76 l7,7 v13 h-83 z"/>
    <path d="M316,328 h76 l7,7 v13 h-83 z"/>
    <path d="M316,394 h76 l7,7 v13 h-83 z"/>
  </g>
  <g fill="none" stroke="#000000">
    <path d="M392,22 v7 h7"/>
    <path d="M67,82 v7 h7"/>
    <path d="M392,82 v7 h7"/>
    <path d="M67,148 v7 h7"/>
    <path d="M392,148 v7 h7"/>
    <path d="M392,202 v7 h7"/>
    <path d="M116,262 v7 h7"/>
    <path d="M191,262 v7 h7"/>
    <path d="M294,262 v7 h7"/>
    <path d="M392,262 v7 h7"/>
    <path d="M116,328 v7 h7"/>
    <path d="M191,328 v7 h7"/>
    <path d="M294,328 v7 h7"/>
    <path d="M392,328 v7 h7"/>
    <path d="M392,394 v7 h7"/>
  </g>
  <text x="322" y="36">zarr.json</text>
  <text x="40" y="96">c/0</text>
  <text x="322" y="96">zarr.json</text>
  <text x="40" y="162">c/0</text>
  <text x="322" y="162">zarr.json</text>
  <text x="322" y="216">zarr.json</text>
  <text x="60" y="276">c/0/0/0</text>
  <text x="135" y="276">c/1/0/0</text>
  <text x="204" y="276">…</text>
  <text x="224" y="276">c/364/0/0</text>
  <text x="322" y="276">zarr.json</text>
  <text x="60" y="342">c/0/0/0</text>
  <text x="135" y="342">c/1/0/0</text>
  <text x="204" y="342">…</text>
  <text x="224" y="342">c/364/0/0</text>
  <text x="322" y="342">zarr.json</text>
  <text x="322" y="408">zarr.json</text>

  <!-- Attributes: a tag each, tied to the zarr.json that holds it. -->
  <g stroke="#000000">
    <line x1="399" y1="32" x2="411" y2="32"/>
    <line x1="399" y1="92" x2="411" y2="92"/>
    <line x1="399" y1="158" x2="411" y2="158"/>
    <line x1="399" y1="212" x2="411" y2="212"/>
    <line x1="399" y1="272" x2="411" y2="272"/>
    <line x1="399" y1="338" x2="411" y2="338"/>
    <line x1="399" y1="404" x2="411" y2="404"/>
  </g>
  <g fill="#ffffff" stroke="#000000" stroke-linejoin="round">
    <path d="M411,32 l8,-10 h146 v20 h-146 z"/>
    <path d="M411,92 l8,-10 h182 v20 h-182 z"/>
    <path d="M411,158 l8,-10 h175 v20 h-175 z"/>
    <path d="M411,212 l8,-10 h132 v20 h-132 z"/>
    <path d="M411,272 l8,-10 h117 v20 h-117 z"/>
    <path d="M411,338 l8,-10 h117 v20 h-117 z"/>
    <path d="M411,404 l8,-10 h146 v20 h-146 z"/>
    <circle cx="420" cy="32" r="2"/>
    <circle cx="420" cy="92" r="2"/>
    <circle cx="420" cy="158" r="2"/>
    <circle cx="420" cy="212" r="2"/>
    <circle cx="420" cy="272" r="2"/>
    <circle cx="420" cy="338" r="2"/>
    <circle cx="420" cy="404" r="2"/>
  </g>
  <text x="427" y="36">model = "NEMO 4.2"</text>
  <text x="427" y="96">units = "degrees_north"</text>
  <text x="427" y="162">units = "degrees_east"</text>
  <text x="427" y="216">forcing = "ERA5"</text>
  <text x="427" y="276">units = "degC"</text>
  <text x="427" y="342">units = "g/kg"</text>
  <text x="427" y="408">forcing = "JRA-55"</text>

  <!-- Legend. -->
  <g stroke="#000000" stroke-linejoin="round">
    <rect x="110" y="473" width="28" height="18" rx="4" fill="#ffffff"/>
    <rect x="230" y="473" width="28" height="18" rx="3" fill="#e0e0e0"/>
    <path d="M344,472 h15 l7,7 v13 h-22 z" fill="#ffffff"/>
    <path d="M359,472 v7 h7" fill="none"/>
    <path d="M450,482 l8,-9 h24 v18 h-24 z" fill="#ffffff"/>
    <circle cx="459" cy="482" r="2" fill="#ffffff"/>
  </g>
  <g font-family="STIX Two Text, Times New Roman, serif" font-size="15">
    <text x="146" y="487">group</text>
    <text x="266" y="487">array</text>
    <text x="374" y="487">file</text>
    <text x="490" y="487">attribute</text>
  </g>
</svg>
