<?xml version="1.0" encoding="utf-8"?>
<!-- The structure of an HDF5 file (HDF5, "What HDF5 is"). The group / holds
     two datasets of coordinates and a group for each run of a model, which
     holds the datasets of the run. Groups are white boxes, datasets gray
     boxes, and attributes tags, tied by a string to the group or the dataset
     they belong to; a legend below names the three. The white background
     keeps the figure legible in dark mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 382" width="620" height="382"
     font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12">
  <rect width="620" height="382" fill="#ffffff"/>
  <text x="10" y="20" font-size="13">ocean.h5</text>

  <!-- Groups: the group / and, inside it, one group per run. -->
  <g fill="none" stroke="#000000">
    <rect x="10" y="28" width="600" height="311" rx="6"/>
    <rect x="30" y="136" width="560" height="111" rx="6"/>
    <rect x="30" y="259" width="560" height="66" rx="6"/>
  </g>
  <g font-weight="bold" font-size="13">
    <text x="24" y="55">/</text>
    <text x="44" y="163">/run_01</text>
    <text x="44" y="286">/run_02</text>
  </g>
  <text x="44" y="315">…</text>

  <!-- Datasets: the name, the type, and the shape. -->
  <g fill="#e0e0e0" stroke="#000000">
    <rect x="24" y="73" width="301" height="22" rx="3"/>
    <rect x="24" y="103" width="301" height="22" rx="3"/>
    <rect x="44" y="181" width="301" height="22" rx="3"/>
    <rect x="44" y="211" width="301" height="22" rx="3"/>
  </g>
  <text x="34" y="88">lat</text>
  <text x="134" y="88">float64</text>
  <text x="199" y="88">720</text>
  <text x="34" y="118">lon</text>
  <text x="134" y="118">float64</text>
  <text x="199" y="118">1440</text>
  <text x="54" y="196">temperature</text>
  <text x="154" y="196">float32</text>
  <text x="219" y="196">365 × 720 × 1440</text>
  <text x="54" y="226">salinity</text>
  <text x="154" y="226">float32</text>
  <text x="219" y="226">365 × 720 × 1440</text>

  <!-- Attributes: a tag each, tied to its group or dataset. -->
  <g stroke="#000000">
    <line x1="38" y1="50" x2="54" y2="50"/>
    <line x1="106" y1="158" x2="122" y2="158"/>
    <line x1="106" y1="281" x2="122" y2="281"/>
    <line x1="325" y1="84" x2="345" y2="84"/>
    <line x1="325" y1="114" x2="345" y2="114"/>
    <line x1="345" y1="192" x2="365" y2="192"/>
    <line x1="345" y1="222" x2="365" y2="222"/>
  </g>
  <g fill="#ffffff" stroke="#000000" stroke-linejoin="round">
    <path d="M54,50 l8,-10 h146 v20 h-146 z"/>
    <path d="M122,158 l8,-10 h132 v20 h-132 z"/>
    <path d="M122,281 l8,-10 h146 v20 h-146 z"/>
    <path d="M345,84 l8,-10 h182 v20 h-182 z"/>
    <path d="M345,114 l8,-10 h175 v20 h-175 z"/>
    <path d="M365,192 l8,-10 h117 v20 h-117 z"/>
    <path d="M365,222 l8,-10 h117 v20 h-117 z"/>
    <circle cx="63" cy="50" r="2"/>
    <circle cx="131" cy="158" r="2"/>
    <circle cx="131" cy="281" r="2"/>
    <circle cx="354" cy="84" r="2"/>
    <circle cx="354" cy="114" r="2"/>
    <circle cx="374" cy="192" r="2"/>
    <circle cx="374" cy="222" r="2"/>
  </g>
  <text x="70" y="54">model = "NEMO 4.2"</text>
  <text x="138" y="162">forcing = "ERA5"</text>
  <text x="138" y="285">forcing = "JRA-55"</text>
  <text x="361" y="88">units = "degrees_north"</text>
  <text x="361" y="118">units = "degrees_east"</text>
  <text x="381" y="196">units = "degC"</text>
  <text x="381" y="226">units = "g/kg"</text>

  <!-- Legend. -->
  <g stroke="#000000" stroke-linejoin="round">
    <rect x="150" y="356" width="28" height="18" rx="4" fill="#ffffff"/>
    <rect x="276" y="356" width="28" height="18" rx="3" fill="#e0e0e0"/>
    <path d="M410,365 l8,-9 h24 v18 h-24 z" fill="#ffffff"/>
    <circle cx="419" cy="365" r="2" fill="#ffffff"/>
  </g>
  <g font-family="STIX Two Text, Times New Roman, serif" font-size="15">
    <text x="186" y="370">group</text>
    <text x="312" y="370">dataset</text>
    <text x="450" y="370">attribute</text>
  </g>
</svg>
