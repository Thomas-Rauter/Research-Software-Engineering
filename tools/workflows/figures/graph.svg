<?xml version="1.0" encoding="utf-8"?>
<!-- The graph of a workflow with three stations (Workflow managers, "Steps,
     jobs, and the graph"). Each box is a job, each arrow a file. The input of
     station 012 has changed, so its jobs and the summary, in gray, run again.
     The white background keeps the figure legible in dark mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 196" width="650" height="196"
     font-family="STIX Two Text, Times New Roman, serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="650" height="196" fill="#ffffff"/>

  <!-- The input files; the changed one in bold. -->
  <g font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12"
     text-anchor="end">
    <text x="76" y="42">007.csv</text>
    <text x="76" y="102" font-weight="bold">012.csv</text>
    <text x="76" y="162">031.csv</text>
  </g>

  <g stroke="#000000" marker-end="url(#arrow)">
    <!-- Inputs to the jobs of clean. -->
    <line x1="82" y1="38" x2="111" y2="38"/>
    <line x1="82" y1="98" x2="111" y2="98"/>
    <line x1="82" y1="158" x2="111" y2="158"/>
    <!-- clean to fit. -->
    <line x1="204" y1="38" x2="233" y2="38"/>
    <line x1="204" y1="98" x2="233" y2="98"/>
    <line x1="204" y1="158" x2="233" y2="158"/>
    <!-- fit to summarize. -->
    <line x1="326" y1="38" x2="383" y2="89"/>
    <line x1="326" y1="98" x2="383" y2="98"/>
    <line x1="326" y1="158" x2="383" y2="107"/>
    <!-- summarize to the result. -->
    <line x1="496" y1="98" x2="525" y2="98"/>
  </g>

  <!-- The jobs; those that run again in gray. -->
  <g stroke="#000000" text-anchor="middle">
    <rect x="112" y="20" width="92" height="36" fill="#ffffff"/>
    <rect x="112" y="80" width="92" height="36" fill="#e0e0e0"/>
    <rect x="112" y="140" width="92" height="36" fill="#ffffff"/>
    <rect x="234" y="20" width="92" height="36" fill="#ffffff"/>
    <rect x="234" y="80" width="92" height="36" fill="#e0e0e0"/>
    <rect x="234" y="140" width="92" height="36" fill="#ffffff"/>
    <rect x="384" y="80" width="112" height="36" fill="#e0e0e0"/>
  </g>
  <g text-anchor="middle">
    <text x="158" y="43">clean 007</text>
    <text x="158" y="103">clean 012</text>
    <text x="158" y="163">clean 031</text>
    <text x="280" y="43">fit 007</text>
    <text x="280" y="103">fit 012</text>
    <text x="280" y="163">fit 031</text>
    <text x="440" y="103">summarize</text>
  </g>

  <!-- The result. -->
  <text x="530" y="102" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace"
        font-size="12">summary.parquet</text>
</svg>
